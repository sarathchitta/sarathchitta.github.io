<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4P386SG51Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4P386SG51Q');
  </script>
  <!--[if lt IE 9]>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
  <![endif]-->
  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true},{left: '\\\\[', right: '\\\\]', display: true},{left: '$', right: '$', display: false},{left: '\\\\(', right: '\\\\)', display: false}]});"></script>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-wrapper">
      <a href="{{ '/' | relative_url }}" class="nav-brand">
        <span class="nav-initials">VC</span>
        <span class="nav-name">Venkata Sarath Chitta</span>
      </a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">About Me</a>
        <a href="{{ '/projects/' | relative_url }}" class="nav-link {% if page.url == '/projects/' %}active{% endif %}">Projects</a>
        <a href="{{ '/blog/' | relative_url }}" class="nav-link {% if page.url == '/blog/' or page.collection == 'posts' %}active{% endif %}">Blog</a>
        <a href="https://linkedin.com/in/sarath-chitta" class="nav-link" target="_blank">LinkedIn ↗</a>
        <a href="https://github.com/Sarath-hotspot" class="nav-link" target="_blank">GitHub ↗</a>
      </div>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="wrapper">
    <section>
      {{ content }}
    </section>
    <footer>
      <p><small>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</small></p>
    </footer>
  </div>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    // Jekyll renders ```mermaid blocks as <pre><code class="language-mermaid">
    // Convert them to <div class="mermaid"> so the library can find them
    document.querySelectorAll('code.language-mermaid').forEach(el => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.closest('pre').replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
  </script>
</body>
</html>
